<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>第三周课表</title>
  <script>
    (function () {
      var pages = [
        "overall.html",
        "Monday.html",
        "Tuesday.html",
        "Wednesday.html",
        "Thursday.html",
        "Friday.html",
        "Saturday.html",
        "Sunday.html"
      ];
      var savedPage = window.location.hash.slice(1);
      if (pages.indexOf(savedPage) === -1) {
        savedPage = "overall.html";
      }

      document.write('<frameset rows="150,*" border="0">');
      document.write('<frame src="title.html" name="title" scrolling="no">');
      document.write('<frameset cols="15%,85%" border="0">');
      document.write('<frame src="nav.html" name="navigation">');
      document.write('<frame src="' + savedPage + '" name="content">');
      document.write('</frameset></frameset>');
    })();
  </script>
</head>
<body></body>
</html>
